<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Card 1 (Left tilt) -->
  <rect x="8" y="16" width="28" height="40" rx="3.5" transform="rotate(-18 8 16)" stroke="#c5a059" stroke-width="2.2" fill="#15120c"/>
  <!-- Card 2 (Middle tilt) -->
  <rect x="18" y="12" width="28" height="42" rx="3.5" transform="rotate(-8 18 12)" stroke="#d4af37" stroke-width="2.4" fill="#1b1710"/>
  <!-- Card 3 (Center foreground) -->
  <rect x="24" y="10" width="28" height="44" rx="4" stroke="#e5c158" stroke-width="2.6" fill="#201b12"/>
  <rect x="27" y="13" width="22" height="38" rx="2.5" stroke="#c5a059" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- 4-point Gold Star in Center Card -->
  <path d="M38 20 C38 28 35 31 27 32 C35 33 38 36 38 44 C38 36 41 33 49 32 C41 31 38 28 38 20 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <defs>
    <linearGradient id="goldGrad" x1="27" y1="20" x2="49" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff5cc"/>
      <stop offset="0.4" stop-color="#e5c158"/>
      <stop offset="1" stop-color="#9a7328"/>
    </linearGradient>
    <filter id="glow" x="22" y="15" width="32" height="34" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>